<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/zdBitYj4r0jtsvWdcq/Fe0UTXncGrLTFWto8dsHEpw='; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
:root{color-scheme:dark;--ink:#080f1a;--paper:#edf6f2;--muted:#9baeb5;--line:#ffffff20;--aqua:#8ee7d2;--gold:#dfb879}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--paper)}body{background:radial-gradient(ellipse at 65% 15%,#153237 0%,#0d1928 35%,#080f1a 78%)}main{max-width:1500px;margin:auto;padding:clamp(22px,4vw,68px);min-height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;display:flex;gap:12px;align-items:center}.brand i{width:9px;height:9px;border-radius:50%;background:var(--aqua);box-shadow:0 0 20px #8ee7d266}.chip{font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:9px 13px;white-space:nowrap}.stage{display:grid;grid-template-columns:1fr 1.06fr;align-items:center;gap:4vw;flex:1;padding:48px 0 25px}.eyebrow{font-size:11px;letter-spacing:.23em;text-transform:uppercase;color:var(--gold);margin:0 0 20px}h1{font-size:clamp(40px,6vw,92px);font-weight:450;line-height:1.05;letter-spacing:-.055em;margin:0 0 24px;overflow-wrap:anywhere}#display-summary{font-size:clamp(17px,1.6vw,23px);color:#bfcecF;line-height:1.6;max-width:36ch;min-height:3.2em;overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;gap:9px;margin-top:26px;font-size:12px;border:1px solid #8ee7d23a;border-radius:30px;padding:10px 15px;color:var(--aqua)}.status:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}body[data-state=error] .status,body[data-state=blocked] .status{color:#f1c68c;border-color:#dfb87966}.scene{position:relative;aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center}.scene svg{width:100%;height:auto;filter:drop-shadow(0 28px 40px #0006)}.ghost{transform-origin:320px 315px;animation:float 15s ease-in-out infinite}.halo{transform-origin:320px 315px;animation:halo 15s ease-in-out infinite}.spark{animation:twinkle 15s ease-in-out infinite}.caption{border-top:1px solid var(--line);padding:24px 0;min-height:80px;font-size:16px;line-height:1.6;color:#d3dfdf;overflow-wrap:anywhere}.footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:18px;color:var(--muted);font-size:11px;line-height:1.7}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-size:11px;color:var(--muted)}select,button{font:inherit;font-size:12px;line-height:1.2;background:#14232f;color:var(--paper);border:1px solid #ffffff35;border-radius:9px;padding:10px 12px;min-height:40px}button{cursor:pointer}button:hover,select:hover{background:#203743}button:focus-visible,select:focus-visible{outline:2px solid var(--aqua);outline-offset:4px}.quiet-line{display:block;color:#718792;margin-top:3px}body[data-reduced-motion=true] .ghost,body[data-reduced-motion=true] .halo,body[data-reduced-motion=true] .spark{animation:none!important;transform:none!important}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}@keyframes halo{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.025)}}@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.ghost,.halo,.spark{animation:none!important;transform:none!important}}@media(max-width:700px){main{padding:24px}.stage{grid-template-columns:1fr;padding-top:42px;gap:0}.scene{max-width:420px;width:100%;justify-self:center;margin:-8px 0}h1{font-size:52px}#display-summary{font-size:18px;min-height:0}.status{margin-top:18px}.caption{min-height:68px;padding:20px 0;font-size:14px}.footer{flex-direction:column;align-items:flex-start;gap:16px}.chip{font-size:9px;padding:7px 10px}.brand{font-size:10px;letter-spacing:.13em}header{gap:10px}.controls{width:100%}select{flex:1}}
</style></head><body data-state="ready" data-reduced-motion="false"><main>

</main><script id="public-data" type="application/json">{"schema":"ominous-public-view/v1","title":"Ominous","summary":"Presentation demo ready.","caption":"Only approved display content appears here.","status":"ready"}</script><script>(() => {
  'use strict';
  const allowed = ['idle','loading','ready','blocked','error','cancelled'];
  const $ = id => document.getElementById(id);
  let view;
  try { view = JSON.parse($('public-data').textContent); }
  catch { view = {title:'',summary:'',caption:'',status:'error'}; }
  const stateSelect = $('preview-state');
  const motionButton = $('motion-toggle');
  let userReduced = document.body.dataset.reducedMotion === 'true';
  let preference;
  try { preference = window.matchMedia('(prefers-reduced-motion: reduce)'); }
  catch { preference = {matches:true}; }
  function paint() {
    $('display-title').textContent = view.title || 'Ominous';
    $('display-summary').textContent = view.summary;
    $('display-caption').textContent = view.caption;
    $('display-status').textContent = 'Demo: ' + view.status;
    document.body.dataset.state = view.status;
    stateSelect.value = view.status;
  }
  function transition(next) {
    if (!allowed.includes(next)) next = 'error';
    view = {title:view.title,summary:next === 'ready' ? view.summary : '',
      caption:next === 'ready' ? view.caption : '',status:next};
    paint();
  }
  function setMotion() {
    const reduced = userReduced || preference.matches;
    document.body.dataset.reducedMotion = String(reduced);
    motionButton.setAttribute('aria-pressed',String(reduced));
    motionButton.textContent = preference.matches ? 'Reduced by device' : (reduced ? 'Enable motion' : 'Reduce motion');
  }
  stateSelect.addEventListener('change',event => transition(event.target.value));
  motionButton.addEventListener('click',() => { userReduced = !userReduced; setMotion(); });
  if (typeof preference.addEventListener === 'function') preference.addEventListener('change',setMotion);
  // No success text is restored by selecting ready after a non-ready state.
  if (!allowed.includes(view.status)) transition('error'); else paint();
  setMotion();
})();</script></body></html>
